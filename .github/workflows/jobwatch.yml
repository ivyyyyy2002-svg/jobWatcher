name: jobwatch

on:
  schedule:
    # ALERT mode — every 30 min at :07 and :37. Pushes only fresh, not-yet-seen jobs.
    # GitHub cron is UTC. Free-tier scheduled runs can be delayed a few minutes
    # at peak times; offset minutes avoid the busiest :00/:30 scheduler windows.
    - cron: "7,37 * * * *"
    # DIGEST mode — once daily around midnight / 1 AM Eastern.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [alert, digest]
        default: alert

permissions:
  contents: write

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      # Decide the mode:
      #  - the 05:00 UTC schedule -> digest
      #  - everything else (30-min schedule) -> alert
      #  - manual run -> whatever you picked in the dropdown
      - name: Determine mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 5 * * *" ]]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=alert" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout dedup state
        if: steps.mode.outputs.mode == 'alert'
        uses: actions/checkout@v4
        with:
          ref: jobwatch-state
          path: .jobwatch-state

      - name: Restore dedup database
        if: steps.mode.outputs.mode == 'alert'
        run: cp .jobwatch-state/seen_jobs.db seen_jobs.db

      - name: Run jobwatch (${{ steps.mode.outputs.mode }})
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOBWATCH_DB: seen_jobs.db
          JOBWATCH_MODE: ${{ steps.mode.outputs.mode }}
        run: python jobwatch.py

      # Keep runtime state on a separate branch so main contains only source changes.
      - name: Persist dedup database
        if: steps.mode.outputs.mode == 'alert'
        run: |
          if cmp -s seen_jobs.db .jobwatch-state/seen_jobs.db; then
            echo "No DB changes to commit."
          else
            cp seen_jobs.db .jobwatch-state/seen_jobs.db
            cd .jobwatch-state
            git config user.name "jobwatch-bot"
            git config user.email "jobwatch-bot@users.noreply.github.com"
            git add seen_jobs.db
            git commit -m "update seen jobs [skip ci]"
            git push origin HEAD:jobwatch-state
          fi
