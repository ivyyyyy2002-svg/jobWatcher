name: jobwatch-owner-and-jessie

on:
  schedule:
    # Regular alerts: both watchers run every 30 minutes.
    - cron: "7,37 * * * *"
    # Daily digests: both watchers run around midnight / 1 AM Eastern.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [alert, digest, test]
        default: alert

permissions:
  contents: write

# Keep state-branch pushes from overlapping with the next scheduled run.
concurrency:
  group: jobwatch-owner-and-jessie
  cancel-in-progress: false

jobs:
  owner-watch:
    name: Owner jobwatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 5 * * *" ]]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=alert" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout owner dedup state
        if: steps.mode.outputs.mode == 'alert'
        uses: actions/checkout@v4
        with:
          ref: jobwatch-state
          path: .jobwatch-state

      - name: Restore owner dedup database
        if: steps.mode.outputs.mode == 'alert'
        run: cp .jobwatch-state/seen_jobs.db seen_jobs.db

      - name: Run owner jobwatch
        if: steps.mode.outputs.mode != 'test'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          JOBWATCH_RESUME_SKILLS: ${{ secrets.JOBWATCH_RESUME_SKILLS }}
          JOBWATCH_DB: seen_jobs.db
          JOBWATCH_MODE: ${{ steps.mode.outputs.mode }}
        run: python jobwatch.py

      - name: Test owner Discord connection
        if: steps.mode.outputs.mode == 'test'
        env:
          TEST_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import requests

          webhook = os.environ.get("TEST_WEBHOOK", "")
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK is not configured")
          response = requests.post(
              webhook,
              json={"content": "✅ Owner Jobwatch Discord connection successful!"},
              timeout=20,
          )
          response.raise_for_status()
          print("Owner Discord test message sent.")
          PY

      - name: Persist owner dedup database
        if: steps.mode.outputs.mode == 'alert'
        run: |
          if cmp -s seen_jobs.db .jobwatch-state/seen_jobs.db; then
            echo "No owner DB changes to commit."
          else
            cp seen_jobs.db .jobwatch-state/seen_jobs.db
            cd .jobwatch-state
            git config user.name "jobwatch-bot"
            git config user.email "jobwatch-bot@users.noreply.github.com"
            git add seen_jobs.db
            git commit -m "update owner seen jobs [skip ci]"
            git push origin HEAD:jobwatch-state
          fi

  jessie-watch:
    name: Jessie jobwatch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Jessie branch
        uses: actions/checkout@v4
        with:
          ref: jessie-jobwatch

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Determine mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 5 * * *" ]]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=alert" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Jessie dedup state
        if: steps.mode.outputs.mode == 'alert'
        uses: actions/checkout@v4
        with:
          ref: jessie-jobwatch-state
          path: .jobwatch-state

      - name: Restore Jessie dedup database when available
        if: steps.mode.outputs.mode == 'alert'
        run: |
          if [[ -f .jobwatch-state/jessie_seen_jobs.db ]]; then
            cp .jobwatch-state/jessie_seen_jobs.db jessie_seen_jobs.db
          else
            echo "No Jessie DB yet; the first run will create it."
          fi

      - name: Run Jessie jobwatch
        if: steps.mode.outputs.mode != 'test'
        env:
          JESSIE_DISCORD_WEBHOOK: ${{ secrets.JESSIE_DISCORD_WEBHOOK }}
          JESSIE_JOBWATCH_DB: jessie_seen_jobs.db
          JOBWATCH_MODE: ${{ steps.mode.outputs.mode }}
        run: python jobwatch_jessie.py

      - name: Test Jessie Discord connection
        if: steps.mode.outputs.mode == 'test'
        env:
          TEST_WEBHOOK: ${{ secrets.JESSIE_DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import requests

          webhook = os.environ.get("TEST_WEBHOOK", "")
          if not webhook:
              raise SystemExit("JESSIE_DISCORD_WEBHOOK is not configured")
          response = requests.post(
              webhook,
              json={"content": "✅ Jessie Jobwatch Discord connection successful!"},
              timeout=20,
          )
          response.raise_for_status()
          print("Jessie Discord test message sent.")
          PY

      - name: Persist Jessie dedup database
        if: steps.mode.outputs.mode == 'alert'
        run: |
          if [[ -f .jobwatch-state/jessie_seen_jobs.db ]] && cmp -s jessie_seen_jobs.db .jobwatch-state/jessie_seen_jobs.db; then
            echo "No Jessie DB changes to commit."
          else
            cp jessie_seen_jobs.db .jobwatch-state/jessie_seen_jobs.db
            cd .jobwatch-state
            git config user.name "jobwatch-bot"
            git config user.email "jobwatch-bot@users.noreply.github.com"
            git add jessie_seen_jobs.db
            git commit -m "update Jessie seen jobs [skip ci]"
            git push origin HEAD:jessie-jobwatch-state
          fi
